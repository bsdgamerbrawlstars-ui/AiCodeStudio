<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Code Studio</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #17212b;
            --text-color: #ffffff;
            --nav-bg: #0e1621;
            --msg-user: #2b5278;
            --msg-ai: #182533;
            --code-bg: #000000;
            --code-text: #4af626;
            --accent: #2481cc;
        }
        
        [data-theme="light"] {
            --bg-color: #f0f2f5;
            --text-color: #000000;
            --nav-bg: #ffffff;
            --msg-user: #e1ffc7;
            --msg-ai: #ffffff;
            --code-bg: #f4f4f4;
            --code-text: #d63384;
            --accent: #007bff;
        }
        
        [data-theme="orange"] {
            --bg-color: #2d1c15;
            --text-color: #ffd8b5;
            --nav-bg: #1a0f0a;
            --msg-user: #d35400;
            --msg-ai: #4a2c1f;
            --code-bg: #110905;
            --code-text: #ffb347;
            --accent: #e67e22;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background 0.3s;
        }

        #main-content {
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        .tab-content {
            display: none;
            height: 100%;
            flex-direction: column;
            padding: 15px;
        }
        .tab-content.active { display: flex; }

        /* --- ЧАТ --- */
        #chat-history {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            padding: 10px 14px;
            border-radius: 12px;
            max-width: 85%;
            word-wrap: break-word;
            font-size: 14px;
            line-height: 1.4;
        }
        .user-msg { background: var(--msg-user); align-self: flex-end; border-bottom-right-radius: 2px; }
        .ai-msg { background: var(--msg-ai); align-self: flex-start; border-bottom-left-radius: 2px; }
        
        .input-area { display: flex; gap: 8px; }
        input {
            flex: 1;
            padding: 12px;
            border-radius: 20px;
            border: 1px solid rgba(128, 128, 128, 0.3);
            background: var(--nav-bg);
            color: var(--text-color);
            outline: none;
        }
        .send-btn {
            background: var(--accent);
            color: #fff;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
        }

        /* --- КОД --- */
        #code-view { display: flex; flex-direction: column; height: 100%; }
        #latest-code {
            flex: 1;
            background: var(--code-bg);
            color: var(--code-text);
            padding: 15px;
            border-radius: 10px;
            font-family: monospace;
            font-size: 13px;
            overflow: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            margin-bottom: 10px;
        }
        .copy-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        /* --- НАСТРОЙКИ --- */
        .setting-group {
            background: var(--msg-ai);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        .setting-title { font-weight: bold; margin-bottom: 10px; font-size: 15px;}
        .theme-btns { display: flex; gap: 10px; }
        .theme-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
        }
        .t-dark { background: #17212b; }
        .t-light { background: #e0e0e0; color: #000; }
        .t-orange { background: #d35400; }
        
        .chat-list-item {
            padding: 10px;
            border-bottom: 1px solid rgba(128,128,128,0.2);
            font-size: 14px;
        }

        /* --- НИЖНЕЕ МЕНЮ --- */
        #bottom-nav {
            display: flex;
            background: var(--nav-bg);
            border-top: 1px solid rgba(128, 128, 128, 0.2);
            padding-bottom: env(safe-area-inset-bottom);
        }
        .nav-btn {
            flex: 1;
            background: none;
            border: none;
            padding: 12px 0;
            color: #8e9297;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }
        .nav-btn.active { color: var(--accent); }
        .nav-btn .icon { font-size: 20px; }
    </style>
</head>
<body>

    <div id="main-content">
        <!-- ВКЛАДКА ЧАТ -->
        <div id="tab-chat" class="tab-content active">
            <div id="chat-history">
                <div class="message ai-msg">Привет. Я готов писать код. Что делаем?</div>
            </div>
            <div class="input-area">
                <input type="text" id="prompt-input" placeholder="Опиши задачу..." autocomplete="off">
                <button class="send-btn" onclick="sendMessage()">▶</button>
            </div>
        </div>

        <!-- ВКЛАДКА КОД -->
        <div id="tab-code" class="tab-content">
            <div id="code-view">
                <div id="latest-code">// Тут появится твой последний сгенерированный код...</div>
                <button class="copy-btn" onclick="copyCode()">Скопировать код</button>
            </div>
        </div>

        <!-- ВКЛАДКА НАСТРОЙКИ -->
        <div id="tab-settings" class="tab-content" style="overflow-y: auto;">
            <div class="setting-group">
                <div class="setting-title">Тема оформления</div>
                <div class="theme-btns">
                    <button class="theme-btn t-dark" onclick="setTheme('dark')">Тёмная</button>
                    <button class="theme-btn t-light" onclick="setTheme('light')">Светлая</button>
                    <button class="theme-btn t-orange" onclick="setTheme('orange')">Оранж</button>
                </div>
            </div>
            
            <div class="setting-group">
                <div class="setting-title">Мои чаты</div>
                <div class="chat-list-item">📝 Генерация менюшки Lua</div>
                <div class="chat-list-item">📝 Фикс ошибки Python</div>
                <div class="chat-list-item">📝 Верстка сайта</div>
            </div>
        </div>
    </div>

    <!-- НИЖНЕЕ МЕНЮ -->
    <div id="bottom-nav">
        <button class="nav-btn active" onclick="switchTab('chat')">
            <span class="icon">💬</span> Чат
        </button>
        <button class="nav-btn" onclick="switchTab('code')">
            <span class="icon">💻</span> Код
        </button>
        <button class="nav-btn" onclick="switchTab('settings')">
            <span class="icon">⚙️</span> Настройки
        </button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand(); // Разворачиваем на весь экран

        const SYSTEM_PROMPT = `Ты профессиональный программист. Пиши чистый код без лишних пояснений, если не просят. Если пишешь код, оборачивай его в блоки \`\`\`язык ... \`\`\`.`;

        // --- ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК ---
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById('tab-' + tabName).classList.add('active');
            document.querySelector(`.nav-btn[onclick="switchTab('${tabName}')"]`).classList.add('active');
        }

        // --- СМЕНА ТЕМЫ ---
        function setTheme(theme) {
            document.body.setAttribute('data-theme', theme);
            tg.HapticFeedback.impactOccurred('light');
        }

        // --- ОТПРАВКА СООБЩЕНИЯ ---
        async function sendMessage() {
            const input = document.getElementById('prompt-input');
            const text = input.value.trim();
            if (!text) return;

            const chat = document.getElementById('chat-history');
            
            // Добавляем сообщение юзера
            chat.innerHTML += `<div class="message user-msg">${text}</div>`;
            input.value = '';
            chat.scrollTop = chat.scrollHeight;

            // Заглушка загрузки
            const loadingId = 'load-' + Date.now();
            chat.innerHTML += `<div class="message ai-msg" id="${loadingId}">Печатает...</div>`;
            chat.scrollTop = chat.scrollHeight;

            try {
                const response = await fetch("https://gen.pollinations.ai/v1/chat/completions", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        model: "mistral",
                        messages: [
                            { role: "system", content: SYSTEM_PROMPT },
                            { role: "user", content: text }
                        ]
                    })
                });

                const data = await response.json();
                let reply = data.choices[0].message.content;

                // Выводим ответ в чат
                const loadingMsg = document.getElementById(loadingId);
                loadingMsg.innerHTML = reply.replace(/\n/g, '<br>');
                chat.scrollTop = chat.scrollHeight;

                // Пытаемся вытащить код и закинуть во вкладку "Код"
                extractAndSaveCode(reply);

            } catch (error) {
                document.getElementById(loadingId).innerText = "Ошибка сети. Сервер не отвечает.";
            }
        }

        // --- ИЗВЛЕЧЕНИЕ КОДА ---
        function extractAndSaveCode(text) {
            // Ищем текст между ``` и ```
            const codeRegex = /```[a-zA-Z]*\n([\s\S]*?)```/g;
            let match = codeRegex.exec(text);
            
            let codeToSave = "";
            
            if (match && match[1]) {
                // Если нашли блок с кодом
                codeToSave = match[1];
            } else {
                // Если блоков нет, но ответ выглядит как код (много скобок и слов типа local/function/var)
                if (text.includes('local ') || text.includes('function ') || text.includes('const ')) {
                    codeToSave = text;
                }
            }

            if (codeToSave) {
                document.getElementById('latest-code').innerText = codeToSave.trim();
                // Даем легкий виброотклик, что код обновился
                tg.HapticFeedback.notificationOccurred('success');
            }
        }

        // --- КОПИРОВАНИЕ ---
        function copyCode() {
            const code = document.getElementById('latest-code').innerText;
            if (!code || code.includes("Тут появится")) return;
            
            navigator.clipboard.writeText(code).then(() => {
                tg.showAlert("Код скопирован!");
                tg.HapticFeedback.notificationOccurred('success');
            });
        }

        // Отправка по Enter
        document.getElementById('prompt-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
